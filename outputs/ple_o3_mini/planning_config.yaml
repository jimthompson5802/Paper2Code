## config.yaml\ntraining:\n  optimizer: \"AdamW\"\n  learning_rate: 1e-4  ## Default within tuning range [1e-5, 3e-4] for some backbones\n  batch_size: 128  ## Predefined per dataset; adjust based on dataset specifics\n  max_epochs: 200  ## Maximum epochs, with early stopping based on patience\n  patience: 16  ## Stop training if validation does not improve after 16 epochs\n  loss:\n    classification: \"cross_entropy\"\n    regression: \"mean_squared_error\"\n  seed_runs: 15  ## Number of experiments per configuration\n\nembeddings:\n  baseline:\n    type: \"linear\"\n    output_dim: 64  ## Tunable output dimension (UniformInt [1, 128])\n  piecewise_linear_encoding:\n    type: \"PLE\"\n    method: \"quantile\"  ## Options: \"quantile\" or \"target_aware\"\n    num_bins: 32  ## Default number of bins, tunable in the range [2, 256]\n  periodic:\n    type: \"Periodic\"\n    k: 16  ## Tunable multiplier (UniformInt [1, 128])\n    sigma: 0.1  ## Standard deviation for initializing trainable bias parameters\n\nbackbone:\n  type: \"MLP\"  ## Options: \"MLP\", \"ResNet\", \"Transformer\"\n  mlp:\n    num_layers: 4\n    hidden_dim: 256\n  resnet:\n    num_layers: 4  ## Example configuration; refer to [13] for details\n  transformer:\n    num_layers: 2  ## Example configuration for FT-Transformer style\n\npreprocessing:\n  quantile_transform: true\n  standardize_targets: true\n  one_hot_encode_categoricals: true\n\nhyperparameter_tuning:\n  enabled: true\n  library: \"Optuna\"\n  search_spaces:\n    learning_rate:\n      distribution: \"loguniform\"\n      low: 1e-5\n      high: 3e-4\n    output_dim:\n      distribution: \"int_uniform\"\n      low: 1\n      high: 128\n    num_bins:\n      distribution: \"int_uniform\"\n      low: 2\n      high: 256\n    periodic_k:\n      distribution: \"int_uniform\"\n      low: 1\n      high: 128\n    periodic_sigma:\n      distribution: \"float\"\n      low: 0.001\n      high: 0.1\n\nevaluation:\n  metrics:\n    classification: \"accuracy\"\n    regression: \"RMSE\"\n  ensemble:\n    groups: 3  ## Number of disjoint ensembles from seed runs